<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 145" width="200" height="145">
  <title>Morcast del Norte — camión con caja alta y hoja calada</title>
  <!-- Silueta del camión con la hoja calada en negativo (fill-rule evenodd).
       Caja al doble de alto que la cabina para que lea residuos, no reparto.
       El bisel de la esquina superior derecha es el corte diagonal de la marca. -->
  <path fill="#144C4F" fill-rule="evenodd" d="
    M 12 14 L 96 14 L 112 30 L 112 60 L 140 60 L 164 84 L 164 106 L 12 106 Z
    M 38 82 C 38 52, 58 34, 88 34 C 88 64, 68 82, 38 82 Z"/>
  <circle cx="48" cy="112" r="15" fill="#144C4F"/>
  <circle cx="48" cy="112" r="6" fill="#fff"/>
  <circle cx="140" cy="112" r="15" fill="#144C4F"/>
  <circle cx="140" cy="112" r="6" fill="#fff"/>
</svg>
